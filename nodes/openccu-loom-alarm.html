<script type="text/javascript">
  RED.nodes.registerType("openccu-loom-alarm", {
    category: "openccu-loom",
    color: "#A1C9F1",
    defaults: {
      name: { value: "" },
      server: { value: "", type: "openccu-loom-server", required: true },
      action: { value: "state" },
      panel: { value: "" }
    },
    inputs: 1,
    outputs: 1,
    icon: "alert.svg",
    label: function () {
      return this.name || `alarm ${this.action}`;
    },
    paletteLabel: "alarm panel"
  });
</script>

<script type="text/html" data-help-name="openccu-loom-alarm">
  <p>Dispatches an alarm-panel WebSocket command (<code>alarm_panel.*</code> in
  <code>assets/wsapi.json</code>) over the shared WS connection of the configured
  server (the same hub as the events and ws-call nodes).</p>

  <h3>Inputs</h3>
  <ul>
    <li><code>msg.action</code> — overrides the configured action.</li>
    <li><code>msg.panel</code> or <code>msg.area_id</code> — overrides the configured
        panel/area id. Fed into the <code>area_id</code> argument of every
        per-area command.</li>
    <li><code>msg.mode</code>, <code>msg.code</code>, <code>msg.force</code>,
        <code>msg.skip_delay</code>, <code>msg.bypass</code>, <code>msg.class</code>,
        <code>msg.from</code>, <code>msg.to</code>, <code>msg.limit</code> — populate
        the matching wsapi argument when the selected action accepts it (see below).</li>
    <li><code>msg.args</code> — an object merged over the assembled arguments,
        key by key; a key present here always wins.</li>
    <li><code>msg.timeout</code> — per-call timeout in ms (hub default: 15000).</li>
  </ul>

  <h3>Actions</h3>
  <table>
    <tr><th>action</th><th>command</th><th>args</th></tr>
    <tr><td><code>state</code> (default)</td><td><code>alarm_panel.state</code></td>
        <td>none — status of every alarm area: state, mode, bypassed sensors,
        active incident, countdown, per-mode readiness, walk-test-active flag.</td></tr>
    <tr><td><code>panels</code></td><td><code>alarm_panel.panels</code></td>
        <td>none — the alarm-control-panel entity projections (HA-state view,
        incl. the master panel).</td></tr>
    <tr><td><code>readiness</code></td><td><code>alarm_panel.readiness</code></td>
        <td><code>area_id</code> — per-mode arm-readiness of one area.</td></tr>
    <tr><td><code>journal</code></td><td><code>alarm_panel.journal</code></td>
        <td><code>area_id?</code>, <code>class?</code>, <code>from?</code>,
        <code>to?</code>, <code>limit?</code> — the alarm engine's event journal,
        newest first.</td></tr>
    <tr><td><code>walktest_status</code></td><td><code>alarm_panel.walktest_status</code></td>
        <td><code>area_id</code> — live status of a walk-test session.</td></tr>
    <tr><td><code>arm</code></td><td><code>alarm_panel.arm</code></td>
        <td><code>area_id</code>, <code>mode</code>, <code>force?</code>,
        <code>skip_delay?</code>, <code>bypass?</code>, <code>code?</code> —
        may return synchronously as <code>armed</code>, or <code>arming</code>
        while counting down the mode's exit delay.</td></tr>
    <tr><td><code>disarm</code></td><td><code>alarm_panel.disarm</code></td>
        <td><code>area_id</code>, <code>code?</code></td></tr>
    <tr><td><code>silence</code></td><td><code>alarm_panel.silence</code></td>
        <td><code>area_id</code>, <code>code?</code> — silences the active
        incident without disarming.</td></tr>
    <tr><td><code>silence_all</code></td><td><code>alarm_panel.silence_all</code></td>
        <td>none — silences the active incident on every alarm area at once.</td></tr>
    <tr><td><code>acknowledge</code></td><td><code>alarm_panel.acknowledge</code></td>
        <td><code>area_id</code>, <code>code?</code> — clears a finished incident.</td></tr>
  </table>

  <h3>Outputs</h3>
  <p><code>msg.payload</code> = the command's result (may be <code>undefined</code>
  for commands without a declared result, e.g. <code>disarm</code>).</p>

  <h3>Capability gate</h3>
  <p>At deploy, the node checks <code>alarm.v1</code> against the server's
  <code>GET /api/v1/info</code> capability list. A daemon that predates the alarm
  engine gets a yellow "alarm.v1 not available" status hint, but the node still
  issues calls — an older daemon rejects them at call time instead.</p>

  <h3>Broadcasts</h3>
  <p>Alarm state changes arrive as WebSocket broadcasts, not as replies to this
  node — subscribe to them with an <code>openccu-loom-events</code> node instead
  (topic <code>alarm.panel</code>). Representative event types:
  <code>alarm.state_changed</code>, <code>alarm.triggered</code>,
  <code>alarm.countdown</code>, <code>alarm.notification</code>,
  <code>alarm.walktest_progress</code>.</p>
</script>
