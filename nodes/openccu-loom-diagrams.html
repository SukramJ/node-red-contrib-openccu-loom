<script type="text/javascript">

    category: "openccu-loom",
    color: "#A1C9F1",
    defaults: {
      name: { value: "" },
      server: { value: "", type: "openccu-loom-server", required: true },
      action: { value: "list" },
      diagramId: { value: "" },
      diagramName: { value: "" },
      visibility: { value: "" }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-area-chart",
    label: function () {
      return this.name || `diagrams ${this.action}`;
    },
    paletteLabel: "diagrams"
  });
</script>

<script type="text/html" data-help-name="openccu-loom-diagrams">
  <p>Reads and maintains the saved diagram definitions of the Config UI via
  <code>/diagrams</code>. <code>list</code> returns the caller's own diagrams
  plus the shared ones; writing is limited to the owner (or an admin).</p>

  <h3>Actions</h3>
  <ul>
    <li><b>list</b> — <code>GET /diagrams</code></li>
    <li><b>get</b> — <code>GET /diagrams/{id}</code></li>
    <li><b>create</b> — <code>POST /diagrams</code></li>
    <li><b>update</b> — <code>PUT /diagrams/{id}</code></li>
    <li><b>delete</b> — <code>DELETE /diagrams/{id}</code></li>
  </ul>

  <h3>Inputs</h3>
  <ul>
    <li><code>msg.action</code>, <code>msg.diagramId</code>,
        <code>msg.diagramName</code>, <code>msg.visibility</code>
        (<code>private|shared</code>) — override the node fields.</li>
    <li><code>msg.config</code> — the diagram definition itself (series,
        axes, …), passed through to the daemon unchanged.</li>
    <li><code>msg.payload</code> — an object here becomes the whole request
        body for <code>create</code>/<code>update</code>, bypassing the fields
        above.</li>
  </ul>
</script>
