<script type="text/html" data-help-name="openccu-loom-alarm-admin">
  <p>The alarm engine's REST surface (<code>/alarm/…</code>): configuring
  zones, sensors, outputs and codes, running walk tests, and operating a zone
  without the WebSocket.</p>

  <p>Companion to the <code>alarm</code> node, which dispatches the same
  operating verbs as <code>alarm_panel.*</code> WebSocket commands over the
  shared hub. Use <code>alarm</code> when a flow already holds a WS connection,
  and this node for everything the WebSocket does not expose — the whole
  configuration surface and starting/stopping walk tests.</p>

  <h3>Live status</h3>
  <ul>
    <li><b>state</b> (default) — <code>GET /alarm/state</code>: every zone's
      state, mode, bypassed sensors, active incident and countdown.</li>
    <li><b>panels</b> — <code>GET /alarm/panels</code>: the
      alarm-control-panel entity projections, incl. the master panel.</li>
    <li><b>journal</b> — <code>GET /alarm/journal</code>, newest first.
      <code>msg.zone</code>, <code>msg.class</code> (<code>arm</code>,
      <code>disarm</code>, <code>trigger</code>, <code>silence</code>,
      <code>bypass</code>, <code>fault</code>, <code>test</code>,
      <code>config</code>), <code>msg.from</code>, <code>msg.to</code> and
      <code>msg.limit</code> filter it.</li>
    <li><b>readiness</b> — per-mode arm readiness of one zone.</li>
  </ul>

  <h3>Zones</h3>
  <ul>
    <li><b>zones</b> / <b>zone</b> — list, or read one by
      <code>msg.zoneId</code>.</li>
    <li><b>zone-create</b> / <b>zone-update</b> — <code>msg.payload</code> is
      the zone object and needs at least <code>{id, name}</code>;
      <code>position</code> and <code>config</code> are optional. The update is
      a replace, so send the complete object.</li>
    <li><b>zone-delete</b> — removes the zone and its enrolments.</li>
  </ul>

  <h3>Sensors, outputs, codes</h3>
  <ul>
    <li><b>sensors</b> / <b>outputs</b> — the enrolments of one zone.</li>
    <li><b>sensors-set</b> / <b>outputs-set</b> — <code>msg.payload</code> must
      be the <em>full</em> array; it replaces the existing set, and an empty
      array unenrols everything. Sensor rows carry
      <code>{id, central, interface_id, channel_address, parameter, type}</code>,
      output rows <code>{id, class, central, channel_address}</code>.</li>
    <li><b>output-candidates</b> — the channels that can back an output class;
      <code>msg.class</code> narrows them. Each row carries the device's rooms
      and functions, so a picker can group by them.</li>
    <li><b>remote-key-candidates</b> — remote / wall-button key channels usable
      for remote-key code bindings.</li>
    <li><b>output-test</b> — fires the output <code>msg.outputId</code> briefly;
      <code>msg.opticalOnly</code> keeps a combined siren silent.</li>
    <li><b>codes</b>, <b>code</b>, <b>code-create</b>, <b>code-update</b>,
      <b>code-delete</b> — the alarm codes. Write bodies come from
      <code>msg.payload</code> (<code>name</code>, <code>kind</code>,
      <code>perms</code>, <code>enabled</code> are required; <code>pin</code>,
      <code>zones</code>, <code>binding</code>, <code>duress</code> and the
      validity window are optional).</li>
  </ul>

  <h3>Walk test</h3>
  <p><b>walktest-start</b> / <b>walktest-stop</b> run a session on
  <code>msg.zoneId</code>, <b>walktest</b> reads its live status. Only reachable
  over REST — the WebSocket exposes the status alone.</p>

  <h3>Operating a zone</h3>
  <p><b>arm</b> (<code>msg.mode</code> plus optional <code>msg.force</code>,
  <code>msg.skipDelay</code>, <code>msg.bypass</code>, <code>msg.code</code>),
  <b>disarm</b>, <b>silence</b>, <b>acknowledge</b> (each honouring
  <code>msg.code</code>) and <b>silence-all</b>. An object
  <code>msg.payload</code> is sent as the arm body verbatim.</p>

  <h3>Capability gate</h3>
  <p>At deploy the node checks <code>alarm.v1</code> against the server's
  <code>GET /api/v1/info</code> capability list and shows a yellow advisory
  status when the alarm engine is not compiled in — every <code>/alarm</code>
  route answers 404 in that case.</p>
</script>
