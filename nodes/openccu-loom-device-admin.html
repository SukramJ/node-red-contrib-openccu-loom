<script type="text/html" data-help-name="openccu-loom-device-admin">
  <p>Device-administration operations. <code>msg.action</code>,
  <code>msg.address</code>, <code>msg.channel</code> and <code>msg.central</code>
  override the node fields.</p>

  <h3>Registry &amp; values</h3>
  <ul>
    <li><b>batch</b> — <code>POST /devices/values:batch</code>;
      <code>msg.payload</code> must be an array of value writes
      <code>{address, channel, parameter, value, priority?}</code>.
      <code>msg.idempotencyKey</code> is honoured.</li>
    <li><b>refresh</b> — <code>POST /devices/refresh</code> (full registry reconcile).</li>
  </ul>

  <h3>Pairing lifecycle</h3>
  <ul>
    <li><b>accept</b> — <code>POST /devices/{addr}/accept</code> (Inbox device).
      Optional first-time configuration in the same call: <code>msg.name</code>,
      <code>msg.includeChannels</code> (cascades the rename to every channel as
      <code>"&lt;name&gt;:&lt;channelNo&gt;"</code>), <code>msg.rooms</code>,
      <code>msg.functions</code> (both arrays of names). An object
      <code>msg.payload</code> is sent as the body verbatim instead.</li>
    <li><b>rename</b> — <code>PATCH /devices/{addr}</code> with the same four
      fields; persists to the CCU. A backend without JSON-RPC (Homegear, CUxD)
      answers 422.</li>
    <li><b>delete</b> — <code>DELETE /devices/{addr}</code>. <code>msg.reset</code>
      also factory-resets the device during removal, <code>msg.force</code>
      removes an unreachable one; both default to a plain unpair.</li>
    <li><b>replace-candidates</b> — <code>GET /devices/{addr}/replace-candidates</code>:
      the devices this (newly paired) device may take over.</li>
    <li><b>replace</b> — <code>POST /devices/{addr}/replace</code>; the device
      being replaced comes from <code>msg.oldAddress</code>.</li>
  </ul>

  <h3>Firmware &amp; diagnostics</h3>
  <ul>
    <li><b>firmware</b> — <code>POST /devices/{addr}/firmware/update</code>. The
      reply may carry an advisory <code>duty_cycle_warning</code>; the update is
      never rejected on that basis.</li>
    <li><b>firmware-download</b> — <code>POST /system/firmware/download</code>
      pulls a firmware image onto the CCU from <code>msg.url</code> (admin).</li>
    <li><b>test</b> — <code>POST /devices/{addr}/test</code> runs the per-device
      communication test and reports <code>passed</code> / <code>duration_ms</code>.</li>
    <li><b>restore-config</b> — <code>POST /devices/{addr}/config/restore</code>
      re-transmits the stored configuration (admin).</li>
  </ul>

  <h3>Channels</h3>
  <ul>
    <li><b>channel-update</b> — <code>PATCH /devices/{addr}/channels/{no}</code>
      with <code>msg.name</code>, <code>msg.rooms</code>, <code>msg.functions</code>.</li>
    <li><b>channel-flags</b> / <b>channel-flags-set</b> —
      <code>GET</code>/<code>PUT /devices/{addr}/channels/{no}/flags</code>: the
      operator overrides <code>msg.hidden</code> (drop from the UI) and
      <code>msg.locked</code> (block operating it).</li>
    <li><b>team-candidates</b> / <b>team-set</b> —
      <code>GET /devices/{addr}/channels/{no}/team-candidates</code> and
      <code>PUT …/team</code>; an empty <code>msg.team</code> detaches the
      channel from its team.</li>
  </ul>
</script>
