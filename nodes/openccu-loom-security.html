<script type="text/html" data-help-name="openccu-loom-security">
  <p>The Security &amp; Safety domain (<code>/security/…</code>): the daemon's
  classified inventory of hazard and fault data points, the standing fault
  ledger, and the operator overrides on top of the classifier.</p>

  <p>Distinct from the <code>alarm</code> nodes: those operate the intrusion
  panel, this one covers the wider hazard picture (smoke, water, gas, CO,
  tamper, battery, technical) that the panel is only one consumer of.</p>

  <h3>Actions</h3>
  <ul>
    <li><b>state</b> (default) — <code>GET /security</code>: the whole domain
      state in one read.</li>
    <li><b>class</b> — <code>GET /security/classes/{class}</code>: one hazard
      or fault class with its full source list. <code>msg.class</code> picks
      it and is required.</li>
    <li><b>faults</b> — <code>GET /security/faults</code>, the standing fault
      ledger.</li>
    <li><b>fault-acknowledge</b> — marks the fault <code>msg.faultId</code> as
      seen (operator). Acknowledging does not clear it; the fault stays until
      its cause goes away.</li>
    <li><b>sources</b> — <code>GET /security/sources</code>, the classified
      data-point inventory. <code>msg.class</code>, <code>msg.central</code>
      and <code>msg.zone_id</code> narrow it; <code>msg.relevant</code> and
      <code>msg.active</code> are flags (set them truthy to switch them on —
      the daemon accepts no other value).</li>
    <li><b>source-override</b> — <code>PUT /security/sources/{ref}</code>
      overrides the classifier's verdict for one data point.</li>
  </ul>

  <h3>Overriding a classification</h3>
  <p><code>msg.ref</code> is the routing key
  <code>&lt;central&gt;|&lt;interface_id&gt;|&lt;channel_address&gt;|&lt;parameter&gt;</code>
  — take it verbatim from a <b>sources</b> row; the node URL-encodes it.</p>
  <p><code>msg.payload</code> carries the override and every field is optional:
  <code>class</code> reclassifies (empty keeps the classifier's verdict),
  <code>included: false</code> removes the source from every aggregate, and
  <code>note</code> records why. Omitting <code>included</code> leaves
  inclusion unchanged, so a request that only names a class reclassifies and
  never excludes.</p>

  <h3>Classes</h3>
  <p><code>smoke</code>, <code>water</code>, <code>gas</code>, <code>co</code>,
  <code>tamper</code>, <code>battery</code>, <code>technical</code>,
  <code>intrusion</code>, <code>panic</code>. An unknown value is rejected by
  the node before the call goes out.</p>
</script>
