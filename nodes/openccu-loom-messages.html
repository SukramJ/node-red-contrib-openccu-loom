<script type="text/javascript">
  RED.nodes.registerType("openccu-loom-messages", {
    category: "openccu-loom",
    color: "#A1C9F1",
    defaults: {
      name: { value: "" },
      server: { value: "", type: "openccu-loom-server", required: true },
      kind: { value: "alarm" },
      action: { value: "list" },
      id: { value: "" },
      central: { value: "" },
      channel: { value: "" },
      interface: { value: "" },
      parameter: { value: "" }
    },
    inputs: 1,
    outputs: 1,
    icon: "alert.svg",
    label: function () {
      return this.name || `${this.kind} ${this.action}`;
    },
    paletteLabel: "messages"
  });
</script>

<script type="text/html" data-template-name="openccu-loom-messages">

  </div>

  </div>
  <div class="form-row">

      <option value="alarm">alarm</option>

  </div>

    <select id="node-input-action">
      <option value="list" data-i18n="openccu-loom-messages.action.list"></option>
      <option value="ack" data-i18n="openccu-loom-messages.action.ack"></option>
      <option value="ack-all" data-i18n="openccu-loom-messages.action.ack-all"></option>
      <option value="suppressed" data-i18n="openccu-loom-messages.action.suppressed"></option>
      <option value="unsuppress" data-i18n="openccu-loom-messages.action.unsuppress"></option>
    </select>
  </div>
  <div class="form-row">

<script type="text/html" data-help-name="openccu-loom-messages">
  <p>Reads and acknowledges the CCU's own alarm / service message queue via
  <code>/alarm-messages</code> resp. <code>/service-messages</code>. Distinct
  from the <code>alarm</code> node, which drives the daemon's alarm engine.</p>

  <h3>Actions</h3>
  <ul>
    <li><b>list</b> — <code>GET</code> the selected queue.</li>
    <li><b>ack</b> — acknowledge one message by <code>msg.id</code>.</li>
    <li><b>ack-all</b> — <code>POST /alarm-messages/ack-all</code> resp.
      <code>/service-messages/ack-all</code>; the reply reports how many were
      <code>acknowledged</code> (service side: only the quittable ones).</li>
    <li><b>suppressed</b> — <code>GET /service-messages/suppressed</code>, the
      permanently suppressed service messages (service side only).</li>
    <li><b>unsuppress</b> — <code>POST /service-messages/unsuppress</code>
      clears one suppression; <code>msg.channel</code> is required,
      <code>msg.interface</code> and <code>msg.parameter</code> narrow it when
      the same channel carries several.</li>
  </ul>

  <p><code>msg.kind</code> (<code>alarm|service</code>), <code>msg.action</code>,
  <code>msg.id</code> and <code>msg.central</code> override the node fields.</p>
</script>
