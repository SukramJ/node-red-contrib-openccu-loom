<script type="text/html" data-help-name="openccu-loom-centrals">
  <p>Multi-CCU registry CRUD via <code>/centrals</code> and
  <code>/centrals/{name}</code>. Mutating calls require admin.</p>
  <p><code>msg.payload</code> for <code>create</code>/<code>update</code> must be
  a <code>CentralRow</code> object.</p>
  <h3>CCU host control</h3>
  <p>All four act on the CCU itself (admin, not the daemon); the daemon answers
  202 and the CCU is unreachable for a while afterwards.</p>
  <ul>
    <li><b>reboot</b> — <code>POST /system/ccu/{central}/reboot</code>.</li>
    <li><b>poweroff</b> — shuts the CCU host down; it stays off until someone
      powers it back on.</li>
    <li><b>safe-mode</b> — restarts the CCU into safe mode.</li>
    <li><b>recovery-mode</b> — restarts the CCU into its recovery system.</li>
  </ul>

  <h3>Astro position</h3>
  <p><b>position</b> — <code>PUT /system/ccu/{central}/position</code> sets the
  CCU's astro reference position. Both coordinates are required: take them from
  the node's fields, from <code>msg.longitude</code>/<code>msg.latitude</code>,
  or from a <code>msg.payload</code> object carrying the same two keys
  (<code>longitude</code> −180…180, <code>latitude</code> −90…90).</p>

  <h3>Add-on self-update</h3>
  <p>The daemon's own CCU add-on package. Only meaningful on platforms with the
  firmware-side installer (OpenCCU / RaspberryMatic); elsewhere
  <code>supported</code> is false and the two verbs answer 404.</p>
  <ul>
    <li><b>addon-update</b> — <code>GET /system/addon-update</code>, the
      current self-update status.</li>
    <li><b>addon-update-check</b> — re-checks for a newer release.</li>
    <li><b>addon-update-install</b> — downloads, verifies and installs it. The
      daemon restarts as part of the install, so the 202 is the last thing this
      connection sees.</li>
  </ul>
</script>
