<script type="text/html" data-help-name="openccu-loom-matter">
  <p>The Matter bridge surface (<code>/node/…</code> since daemon API 14):
  what the bridge exposes to Matter controllers, which ecosystems are
  commissioned to it, and the commissioning windows that let new ones in.
  Every write and the pairing codes need an admin.</p>

  <h3>Status and topology</h3>
  <ul>
    <li><b>status</b> (default) — bridge runtime state: endpoint count, fabric
      count, whether a commissioning window is open.</li>
    <li><b>compatibility</b> — how each commissioned ecosystem will treat what
      the bridge exposes. Read this before blaming the bridge for a device an
      ecosystem renders oddly.</li>
    <li><b>endpoints</b> — the assembled topology as a controller sees it.</li>
    <li><b>mdns</b> — what the bridge advertises over mDNS, and what is wrong
      with it. The first place to look when no controller finds the
      bridge.</li>
    <li><b>sessions</b> — open Matter sessions with per-session liveness.</li>
    <li><b>events</b> — recent pairing, session and discovery events; the
      moments that explain a failed pairing.</li>
    <li><b>force-sync</b> — rebuilds the endpoints from the current
      selection (admin); pairings are untouched. An <b>exposure-set</b>
      already does this itself.</li>
  </ul>

  <h3>Fabrics</h3>
  <ul>
    <li><b>fabrics</b> — the ecosystems commissioned to the bridge.</li>
    <li><b>fabric-delete</b> — unpairs the fabric whose index (1…254) is
      <code>msg.fabricId</code> (admin). That ecosystem loses the bridge.</li>
    <li><b>factory-reset</b> — removes <em>every</em> fabric (admin,
      destructive): every controller has to re-pair afterwards. The node fills
      in the daemon's required confirmation token itself, so this action needs
      no payload — wire it behind something deliberate.</li>
  </ul>

  <h3>Exposure</h3>
  <ul>
    <li><b>exposure</b> — every item the bridge could expose, with its
      <code>key</code>, whether it is enabled and the verdict on whether it
      can be mapped at all.</li>
    <li><b>exposure-set</b> — applies a batch of item changes and rebuilds
      the endpoints (admin). <code>msg.payload</code> is one change
      <code>{key, enabled}</code> (<code>name</code> renames the item), an
      array of them, or <code>{items: [...]}</code>. Take the keys from
      <b>exposure</b>; they are the daemon's and are not built by hand.</li>
    <li><b>exposure-preview</b> — the same body; answers with the items as
      the batch would leave them, and writes nothing.</li>
  </ul>

  <h3>Commissioning</h3>
  <ul>
    <li><b>setup-payload</b> / <b>commissioning-window</b> — the pairing
      codes (admin): of the open window, else the configured ones;
      <code>window_open</code> tells which.</li>
    <li><b>commissioning-open</b> — opens a commissioning window (admin) and
      answers with its codes. <b>share</b> is the same window, for handing the
      bridge to another ecosystem. Both take an optional
      <code>msg.durationSeconds</code> (180…900, default 900); a
      <code>msg.payload</code> object is passed through as the body
      instead.</li>
    <li><b>commissioning-close</b> — closes an open window early (admin).</li>
  </ul>
</script>
