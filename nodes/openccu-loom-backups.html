<script type="text/html" data-help-name="openccu-loom-backups">
  <p>CCU backup archives (<code>/backups</code>): triggering a backup on the
  CCU, listing and downloading what is stored locally, importing an archive
  from elsewhere, and restoring one. Every verb requires admin.</p>

  <h3>Reading</h3>
  <ul>
    <li><b>list</b> (default) — the locally stored backups.</li>
    <li><b>storage</b> — <code>GET /backups/storage</code>: where those
      archives are kept, and how much room is left.</li>
  </ul>

  <h3>Creating and importing</h3>
  <ul>
    <li><b>trigger</b> — asks the CCU for a fresh backup.
      <code>msg.centralName</code> picks the central; omitted, the daemon backs
      up the first registered one.</li>
    <li><b>upload</b> — imports an externally-supplied archive.
      <code>msg.payload</code> must be the <code>.sbk</code> bytes as a
      <code>Buffer</code> — wire a <b>file in</b> node set to output a buffer
      straight into this one. <code>msg.filename</code> names the part
      (default <code>backup.sbk</code>).</li>
  </ul>

  <h3>Using a stored backup</h3>
  <ul>
    <li><b>download</b> — streams the archive <code>msg.backupId</code>.
      <code>msg.payload</code> comes back as a <code>Buffer</code> of raw
      <code>.sbk</code> bytes, ready for a <b>file out</b> node — not as
      JSON.</li>
    <li><b>restore</b> — restores <code>msg.backupId</code> onto its CCU. The
      daemon answers 202 and applies it asynchronously; a 422 means the restore
      was refused before anything reached any CCU (for instance because the
      backup names no owning CCU and several are configured).</li>
    <li><b>delete</b> — removes the stored archive. Irreversible, and it does
      not touch anything on the CCU.</li>
  </ul>
</script>
