<script type="text/html" data-help-name="openccu-loom-groups">
  <p>Administers the CCU's heating groups via <code>/groups</code>. Mutating
  calls require admin.</p>

  <h3>Actions</h3>
  <ul>
    <li><b>list</b> — <code>GET /groups</code>: the groups of the addressed
      central, each with its members.</li>
    <li><b>types</b> — <code>GET /groups/types</code>: the assignable group
      types, i.e. the values a <code>type_id</code> may take.</li>
    <li><b>suitable-members</b> — <code>GET /groups/suitable-members</code>:
      the channels assignable to a group of <code>msg.typeId</code>, split into
      <code>assignable</code> and <code>leftover</code>.</li>
    <li><b>create</b> — <code>POST /groups</code> with <code>msg.typeId</code>,
      <code>msg.groupName</code>, optional <code>msg.forbidSingleOperation</code>
      and <code>msg.members</code>.</li>
    <li><b>update</b> — <code>PUT /groups/{id}</code> with
      <code>msg.groupName</code> and the same optional fields; the member list
      replaces the existing one.</li>
    <li><b>delete</b> — <code>DELETE /groups/{id}</code>.</li>
  </ul>

  <h3>Inputs</h3>
  <ul>
    <li><code>msg.action</code>, <code>msg.groupId</code>,
        <code>msg.groupName</code>, <code>msg.typeId</code>,
        <code>msg.central</code> — override the node fields.</li>
    <li><code>msg.members</code> — an array of member objects, each at least
        <code>{address}</code>.</li>
    <li><code>msg.payload</code> — an object here is sent as the whole request
        body for <code>create</code>/<code>update</code>, bypassing the fields
        above.</li>
  </ul>
</script>
